name: Importer la version signée 7.22
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Saisir IMPORTER pour enregistrer les sources et l’APK 7.22 validés'
        required: true
        type: string
permissions:
  contents: read
jobs:
  importer:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'IMPORTER'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restaurer uniquement les fichiers vérifiés
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,zlib
          from pathlib import Path,PurePosixPath
          if Path('.import-7.22').exists():
              print('Version 7.22 déjà importée.');raise SystemExit(0)
          packed=base64.b64decode(Path('patch722.b64').read_text().strip(),validate=True)
          if hashlib.sha256(packed).hexdigest()!='bfaf42f39547657110df262b1f51425b7f66ec28987f7b97cd3f778e61f4a9f6':
              raise SystemExit('Paquet modifié ou incomplet')
          data=json.loads(zlib.decompress(packed))
          base=Path('distribution/Accueil2008GT_v7.21.apk').read_bytes()
          if hashlib.sha256(base).hexdigest()!=data['baseSha256']:raise SystemExit('APK de base différent')
          parts=[]
          for op in data['apkOps']:
              if op[0]=='c':
                  start,length=op[1:]
                  if start<0 or length<0 or start+length>len(base):raise SystemExit('Copie binaire invalide')
                  parts.append(base[start:start+length])
              elif op[0]=='d':parts.append(base64.b64decode(op[1],validate=True))
              else:raise SystemExit('Opération inconnue')
          apk=b''.join(parts)
          if hashlib.sha256(apk).hexdigest()!=data['apkSha256']:raise SystemExit('APK signé différent')
          allowed={'sources_assets','module_GPS_java','outils','tests','distribution'}
          for rel,content in data['files'].items():
              p=PurePosixPath(rel)
              if p.is_absolute() or '..' in p.parts or not p.parts:raise SystemExit('Chemin interdit')
              if p.parts[0] not in allowed and rel not in ['README.md','LISEZMOI.txt']:raise SystemExit('Fichier non autorisé')
              if p.suffix.lower() in ['.p12','.jks','.keystore']:raise SystemExit('Clé privée interdite')
              target=Path(rel);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(base64.b64decode(content,validate=True))
          Path('distribution/Accueil2008GT_v7.22.apk').write_bytes(apk)
          meta=json.loads(Path('distribution/release.json').read_text())
          if meta['sha256']!=data['apkSha256']:raise SystemExit('Empreinte de métadonnées incorrecte')
          Path('.import-7.22').write_text(data['apkSha256']+'\n')
          PY
      - run: npm install --prefix tests --ignore-scripts
      - run: npm test --prefix tests
      - run: sha256sum --check distribution/SHA256SUMS
      - run: python3 outils/validate_release.py distribution/release.json
      - name: Enregistrer l’APK et les sources sans annoncer de version non publiée
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md LISEZMOI.txt sources_assets module_GPS_java outils tests distribution .import-7.22
          if ! git diff --cached --quiet; then
            git commit -m 'Afficher l’adresse au bas de la route et préparer la version 7.22'
            git push origin HEAD:main
          fi
