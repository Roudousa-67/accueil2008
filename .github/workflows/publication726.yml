name: Publier Accueil 2008 GT 7.26
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publication726.yml']
permissions:
  contents: write
concurrency:
  group: publication-version
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstituer et vérifier l’APK déjà signé
        run: |
          python3 outils/reconstruire_apk726.py
          python3 - <<'PY'
          import os,subprocess,json,hashlib,re,pathlib,zipfile
          apk=pathlib.Path('distribution/Accueil2008GT_v7.26.apk')
          meta=json.load(open('distribution/release726.json'))
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==meta['sha256']
          tool=sorted(pathlib.Path(os.environ['ANDROID_HOME']).glob('build-tools/*/apksigner'))[-1]
          def cert(p):
              s=subprocess.check_output([str(tool),'verify','--print-certs',str(p)],text=True)
              return set(re.findall(r'certificate SHA-256 digest: ([0-9a-fA-F]+)',s))
          assert cert(apk) and cert(apk)==cert('distribution/Accueil2008GT_v7.25.apk')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              for n in z.namelist():
                  if not n.startswith('assets/'):continue
                  rel=pathlib.PurePosixPath(n).relative_to('assets')
                  assert '..' not in rel.parts
                  p=pathlib.Path('sources_assets')/str(rel);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
          print('SHA256, signature d’origine et intégrité vérifiés.')
          PY
      - run: npm ci --prefix tests --ignore-scripts
      - run: npm test --prefix tests
      - run: node tests/decors726.cjs
      - name: Publier puis vérifier le téléchargement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=Accueil2008GT_v7.26.apk
          if gh release view v7.26 >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/verify726"
            gh release download v7.26 --pattern "$apk" --dir "$RUNNER_TEMP/verify726"
            cmp "distribution/$apk" "$RUNNER_TEMP/verify726/$apk"
          else
            gh release create v7.26 "distribution/$apk" distribution/release726.json --target "$GITHUB_SHA" --title 'Accueil 2008 GT 7.26' --notes 'Décors enrichis, portique abaissé et vue alignée. Signalisation GPS vérifiée ; feux, circulation et aires indiqués comme illustratifs. Signature d’origine conservée. Essai sur autoradio à effectuer.'
          fi
      - name: Mettre à jour les sources et le bon fichier de mise à jour
        run: |
          cp distribution/release726.json version.json
          cp distribution/release726.json distribution/release.json
          sha256sum distribution/Accueil2008GT_v7.26.apk >> distribution/SHA256SUMS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources_assets distribution/Accueil2008GT_v7.26.apk distribution/release.json distribution/SHA256SUMS version.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publier les sources 7.26 et annoncer l’APK signé disponible'
            git push origin HEAD:main
          fi
