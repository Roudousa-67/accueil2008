name: Publier la version validée
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Après validation, saisir PUBLIER pour publier cette version'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publier:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLIER'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix tests --ignore-scripts
      - run: npm test --prefix tests
      - run: sha256sum --check distribution/SHA256SUMS
      - name: Valider la proposition de version
        run: python3 outils/validate_release.py distribution/release.json
      - name: Publier ou vérifier l’APK déjà signé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("distribution/release.json"))["version"])')
          apk="Accueil2008GT_v${version}.apk"
          if gh release view "v${version}" >/dev/null 2>&1; then
            test "$(gh release view "v${version}" --json isDraft --jq '.isDraft')" = false
            mkdir -p "$RUNNER_TEMP/release-verify"
            gh release download "v${version}" --pattern "$apk" --dir "$RUNNER_TEMP/release-verify"
            cmp "distribution/$apk" "$RUNNER_TEMP/release-verify/$apk"
          else
            gh release create "v${version}" "distribution/$apk" distribution/SHA256SUMS --target "$GITHUB_SHA" --title "Accueil 2008 GT ${version}" --notes-file distribution/NOTES.md
          fi
      - name: Annoncer la version seulement après disponibilité de l’APK
        run: |
          set -euo pipefail
          cp distribution/release.json version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m 'Annoncer la version publiée aux autoradios'
            git push origin HEAD:main
          fi
