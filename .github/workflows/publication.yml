name: Publier la version validée
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Après validation, saisir PUBLIER pour publier cette version'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publier:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLIER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix tests --ignore-scripts
      - run: npm test --prefix tests
      - run: sha256sum --check distribution/SHA256SUMS
      - name: Valider les métadonnées
        run: python3 outils/validate_release.py
      - name: Publier l’APK déjà signé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')
          apk="distribution/Accueil2008GT_v${version}.apk"
          gh release create "v${version}" "$apk" distribution/SHA256SUMS --target "$GITHUB_SHA" --title "Accueil 2008 GT ${version}" --notes-file distribution/NOTES.md
