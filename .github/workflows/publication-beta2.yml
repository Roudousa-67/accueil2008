name: Publier la bêta 2 — grande voiture et localités
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publication-beta2.yml']
permissions:
  contents: write
concurrency:
  group: publication-beta
  cancel-in-progress: false
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests --ignore-scripts
      - name: Préparer et tester le nouveau cadrage et les panneaux
        run: |
          python3 beta/outils/preparer_sources_beta.py sources_assets "$RUNNER_TEMP/beta-assets" beta/sources_assets/beta727.js
          BETA_ASSETS="$RUNNER_TEMP/beta-assets" NODE_PATH="$GITHUB_WORKSPACE/tests/node_modules" node beta/tests/beta727.cjs
          BETA_ASSETS="$RUNNER_TEMP/beta-assets" NODE_PATH="$GITHUB_WORKSPACE/tests/node_modules" node beta/tests/focus728.cjs
      - name: Vérifier la configuration de signature d’origine
        env:
          ACCUEIL_KEYSTORE_BASE64: ${{ secrets.ACCUEIL_KEYSTORE_BASE64 }}
          ACCUEIL_SIGNING_PASSWORD: ${{ secrets.ACCUEIL_SIGNING_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          missing=[n for n in ['ACCUEIL_KEYSTORE_BASE64','ACCUEIL_SIGNING_PASSWORD'] if not os.environ.get(n)]
          if missing:
              message='Signature bloquée : configuration d’origine absente ('+', '.join(missing)+'). Aucune nouvelle clé ne sera créée. Les sources et leurs tests sont disponibles ; aucun nouvel APK n’est annoncé.'
              pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(message)
              raise SystemExit(message)
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'accueil-original.p12'
          p.write_bytes(base64.b64decode(os.environ['ACCUEIL_KEYSTORE_BASE64'],validate=True));p.chmod(0o600)
          PY
      - run: python3 -m pip install --quiet Pillow
      - name: Construire avec la signature d’origine
        env:
          ACCUEIL_SIGNING_PASSWORD: ${{ secrets.ACCUEIL_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          aligner="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)"
          python3 beta/outils/preparer_beta.py --base distribution/Accueil2008GT_v7.26.apk --keystore "$RUNNER_TEMP/accueil-original.p12" --apksigner "$signer" --zipalign "$aligner" --tools outils --output beta/distribution/Accueil2008GT_v7.27.2.apk
      - name: Contrôler le paquet et préparer le canal bêta
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,os,json,hashlib,zipfile
          base=pathlib.Path('distribution/Accueil2008GT_v7.26.apk');apk=pathlib.Path('beta/distribution/Accueil2008GT_v7.27.2.apk')
          assert hashlib.sha256(base.read_bytes()).hexdigest()=='b101e50c1e1c0f295ea1b8471f1ee8aa87a9b0a6b2b73abadc7f841f2330f109'
          assert json.loads(pathlib.Path('version.json').read_text())['version']=='7.26'
          aapt=sorted((pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/aapt'))[-1]
          badging=subprocess.check_output([aapt,'dump','badging',apk],text=True)
          assert "package: name='fr.gtline.accueil2008.beta' versionCode='1002' versionName='7.27.2'" in badging
          manifest=subprocess.check_output([aapt,'dump','xmltree',apk,'AndroidManifest.xml'],text=True)
          assert 'fr.gtline.accueil2008.beta.gpsdock' in manifest
          assert 'android.intent.category.HOME' not in manifest and 'android.intent.action.BOOT_COMPLETED' not in manifest
          with zipfile.ZipFile(apk) as z,zipfile.ZipFile(base) as b:
              assert z.testzip() is None
              for n in ['classes.dex','classes2.dex','classes3.dex']:assert z.read(n)==b.read(n)
              assert 'focus728.js' in z.read('assets/index.html').decode()
              assert '/main/version-beta.json?t=' in z.read('assets/v4.js').decode()
              for n in z.namelist():assert not n.endswith(('.p12','.jks','.keystore'))
          meta={'version':'7.27.2','channel':'beta','package':'fr.gtline.accueil2008.beta','label':'Accueil 2008 GT Bêta 2','apk':'https://github.com/Roudousa-67/accueil2008/releases/download/v7.27.2/Accueil2008GT_v7.27.2.apk','sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'notes':'Voiture agrandie et panneaux de localités proches tous les 1 km, réglables à 500 m, 1, 2, 5 ou 10 km. Distances à vol d’oiseau, indépendantes de Waze. Bêta séparée : garder la version stable installée. Essai sur autoradio à effectuer.'}
          pathlib.Path('beta/distribution/release-beta2.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publier et vérifier le téléchargement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v7.27.2 >/dev/null 2>&1; then
            test "$(gh release view v7.27.2 --json isPrerelease -q .isPrerelease)" = true
          else
            gh release create v7.27.2 beta/distribution/Accueil2008GT_v7.27.2.apk beta/distribution/release-beta2.json --prerelease --target "$GITHUB_SHA" --title 'Accueil 2008 GT — Bêta 2 (7.27.2)' --notes-file beta/LISEZMOI.md
          fi
          gh release download v7.27.2 --pattern Accueil2008GT_v7.27.2.apk --dir "$RUNNER_TEMP/download-beta2"
          cmp beta/distribution/Accueil2008GT_v7.27.2.apk "$RUNNER_TEMP/download-beta2/Accueil2008GT_v7.27.2.apk"
      - name: Mettre à jour uniquement la distribution bêta
        run: |
          cp beta/distribution/release-beta2.json version-beta.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version-beta.json beta/distribution/release-beta2.json
          git add -f beta/distribution/Accueil2008GT_v7.27.2.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publier la bêta 7.27.2 et conserver la stable 7.26'
            git push origin HEAD:main
          fi
      - name: Effacer la copie temporaire de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/accueil-original.p12"
