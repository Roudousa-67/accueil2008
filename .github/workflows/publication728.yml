name: Publier la version normale 7.28
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publication-stable
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests --ignore-scripts
      - run: npm test --prefix tests
      - name: Charger uniquement la clé d’origine
        env:
          ACCUEIL_KEYSTORE_BASE64: ${{ secrets.ACCUEIL_KEYSTORE_BASE64 }}
          ACCUEIL_SIGNING_PASSWORD: ${{ secrets.ACCUEIL_SIGNING_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          if not all(os.environ.get(k) for k in ['ACCUEIL_KEYSTORE_BASE64','ACCUEIL_SIGNING_PASSWORD']):raise SystemExit('Configuration de signature d’origine manquante. Aucune nouvelle clé ne sera créée.')
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'accueil-original.p12'
          p.write_bytes(base64.b64decode(os.environ['ACCUEIL_KEYSTORE_BASE64'],validate=True));p.chmod(0o600)
          PY
      - name: Construire et vérifier la signature
        env:
          ACCUEIL_SIGNING_PASSWORD: ${{ secrets.ACCUEIL_SIGNING_PASSWORD }}
          ACCUEIL_KEY_PASSWORD: ${{ secrets.ACCUEIL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          python3 outils/preparer_apk728.py --keystore "$RUNNER_TEMP/accueil-original.p12" --apksigner "$signer" --output distribution/Accueil2008GT_v7.28.apk
      - name: Préparer les métadonnées et contrôler Android
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,os,subprocess
          p=pathlib.Path('distribution/Accueil2008GT_v7.28.apk');sha=hashlib.sha256(p.read_bytes()).hexdigest()
          aapt=sorted((pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/aapt'))[-1]
          text=subprocess.check_output([aapt,'dump','badging',p],text=True)
          assert "package: name='fr.gtline.accueil2008' versionCode='98' versionName='7.28'" in text
          meta={'version':'7.28','apk':'https://github.com/Roudousa-67/accueil2008/releases/download/v7.28/Accueil2008GT_v7.28.apk','sha256':sha,'notes':'Voiture agrandie, bande du décor supprimée, vitesse et limitation côte à côte, météo en haut à droite. Cadre GPS réaligné. Vue conducteur GPS activable, suivi GPX local facultatif, panneaux des localités proches réglables en kilomètres. Paramètres de navigation rangés. L’itinéraire Waze n’est pas récupéré par le widget. Signature d’origine conservée. Essai sur autoradio à effectuer.'}
          pathlib.Path('distribution/release728.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publier la version normale et vérifier son téléchargement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v7.28 >/dev/null 2>&1; then
            test "$(gh release view v7.28 --json isPrerelease -q .isPrerelease)" = false
          else
            gh release create v7.28 distribution/Accueil2008GT_v7.28.apk distribution/release728.json --latest --target "$GITHUB_SHA" --title 'Accueil 2008 GT 7.28' --notes-file MISE_A_JOUR_728.md
          fi
          gh release download v7.28 --pattern Accueil2008GT_v7.28.apk --dir "$RUNNER_TEMP/verification728"
          cmp distribution/Accueil2008GT_v7.28.apk "$RUNNER_TEMP/verification728/Accueil2008GT_v7.28.apk"
      - name: Annoncer la version installable uniquement après publication
        run: |
          cp distribution/release728.json version.json
          cp distribution/release728.json distribution/release.json
          sha256sum distribution/Accueil2008GT_v7.28.apk >> distribution/SHA256SUMS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json distribution/release.json distribution/release728.json distribution/SHA256SUMS
          git add -f distribution/Accueil2008GT_v7.28.apk
          git commit -m 'Publier la version normale 7.28 avec la signature d’origine'
          git push origin HEAD:main
      - name: Effacer la copie temporaire de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/accueil-original.p12"
