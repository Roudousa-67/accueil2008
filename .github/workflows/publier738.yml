name: Construire et publier APK 7.38
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publication-stable
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests --ignore-scripts
      - run: npm test --prefix tests
      - name: Exiger la clé d'origine dans les secrets GitHub
        env:
          ACCUEIL_KEYSTORE_BASE64: ${{ secrets.ACCUEIL_KEYSTORE_BASE64 }}
          ACCUEIL_SIGNING_PASSWORD: ${{ secrets.ACCUEIL_SIGNING_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          if not os.getenv('ACCUEIL_KEYSTORE_BASE64') or not os.getenv('ACCUEIL_SIGNING_PASSWORD'):
              raise SystemExit('Secrets de signature absents : publication annulée sans générer de nouvelle clé.')
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'accueil-original.p12'
          p.write_bytes(base64.b64decode(os.environ['ACCUEIL_KEYSTORE_BASE64'],validate=True))
          p.chmod(0o600)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compiler le pont Android (GPS, fichiers, serveur de transfert)
        run: |
          set -euo pipefail
          # Depuis la 7.35 le pont 7.30 n'était plus embarqué : il est recompilé à chaque version.
          PLATFORM=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          DEX_COMPILER=$(find "$ANDROID_HOME/build-tools" -name d8 -type f | sort -V | tail -1)
          test -n "$PLATFORM" && test -n "$DEX_COMPILER"
          mkdir -p "$RUNNER_TEMP/pont/classes" "$RUNNER_TEMP/pont/dex"
          javac --release 8 -encoding UTF-8 -cp "$PLATFORM" -d "$RUNNER_TEMP/pont/classes" module_GPS_java/java/fr/gtline/accueil2008/*.java
          jar --create --file "$RUNNER_TEMP/pont/pont.jar" -C "$RUNNER_TEMP/pont/classes" .
          "$DEX_COMPILER" --release --min-api 24 --lib "$PLATFORM" --output "$RUNNER_TEMP/pont/dex" "$RUNNER_TEMP/pont/pont.jar"
          mv "$RUNNER_TEMP/pont/dex/classes.dex" "$RUNNER_TEMP/pont/classes3.dex"
          sha256sum "$RUNNER_TEMP/pont/classes3.dex"
      - name: Construire et signer 7.38
        env:
          ACCUEIL_SIGNING_PASSWORD: ${{ secrets.ACCUEIL_SIGNING_PASSWORD }}
          ACCUEIL_KEY_PASSWORD: ${{ secrets.ACCUEIL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -n "$signer"
          python3 outils/preparer_apk728.py --version 7.38 --native-dex "$RUNNER_TEMP/pont/classes3.dex" --keystore "$RUNNER_TEMP/accueil-original.p12" --apksigner "$signer" --output "$RUNNER_TEMP/Accueil2008GT_v7.38.apk"
      - name: Vérifier les métadonnées et publier le vrai APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/Accueil2008GT_v7.38.apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          "$aapt" dump badging "$apk" | grep -F "package: name='fr.gtline.accueil2008' versionCode='108' versionName='7.38'"
          sha256sum "$apk"
          if gh release view v7.38 >/dev/null 2>&1; then
            echo 'La release existe déjà : ne pas écraser un APK publié.'
            exit 1
          fi
          gh release create v7.38 "$apk" --target "$GITHUB_SHA" --title "Accueil 2008 GT 7.38" --notes "Version 7.38 : décor (GPS réseau ignoré, village par l’adresse) ; soleil, lune, lever et coucher réels ; météo dans tous les décors avec neige au sol et orages ; panneaux d’autoroute (prochaine sortie, prochaine station et son prix) ; stations filtrées (carburant, AdBlue, rayon, paiement) avec carte ; cartes des trajets ; tickets et GPX par QR via l’autoradio ; rapport de diagnostic ; réglages rangés. Essais sur autoradio à effectuer."
          mkdir -p "$RUNNER_TEMP/check"
          gh release download v7.38 --pattern Accueil2008GT_v7.38.apk --dir "$RUNNER_TEMP/check"
          cmp "$apk" "$RUNNER_TEMP/check/Accueil2008GT_v7.38.apk"
      - name: Annoncer uniquement le fichier réellement téléchargeable
        run: |
          python3 - <<'PY'
          import json,hashlib,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'Accueil2008GT_v7.38.apk'
          j=json.loads(pathlib.Path('distribution/release738.json').read_text())
          j['sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          for name in ('version.json','distribution/release738.json'):
              pathlib.Path(name).write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json distribution/release738.json
          git commit -m 'Annoncer APK 7.38 signé et téléchargé avec empreinte vérifiée'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Effacer la copie temporaire de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/accueil-original.p12"
