name: Vérifier les sources
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix tests --ignore-scripts
      - run: npm test --prefix tests
        env:
          WIDGET_QA: ${{ runner.temp }}/widget-qa
      - name: Contrôler visuellement le widget 7.28
        run: NODE_PATH="$GITHUB_WORKSPACE/tests/node_modules" WIDGET_QA="$RUNNER_TEMP/widget-qa" node tests/render728.cjs
      - name: Joindre les captures du rendu réel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-jour-nuit
          path: ${{ runner.temp }}/widget-qa
          if-no-files-found: warn
          retention-days: 14
      - name: Contrôler l’APK livré
        run: sha256sum --check distribution/SHA256SUMS
      - name: Valider la version préparée
        run: python3 outils/validate_release.py distribution/release.json --historical-check

      - name: Vérifier la syntaxe de la préparation APK
        run: python3 -m py_compile outils/preparer_apk_decors.py outils/preparer_apk725.py outils/preparer_apk728.py

      - name: Charger la base 7.24 pour mesurer avant et après
        if: hashFiles('tests/benchmark725.cjs') != ''
        uses: actions/checkout@v4
        with:
          ref: 54875bf8713abdc0e38befa3caf8bbe119ac90c6
          path: baseline724
      - name: Comparer les performances dans le simulateur
        if: hashFiles('tests/benchmark725.cjs') != ''
        run: NODE_PATH="$GITHUB_WORKSPACE/tests/node_modules" BASELINE_ROOT="$GITHUB_WORKSPACE/baseline724" PERF_REPORT="$RUNNER_TEMP/mesures-performances725.json" node tests/benchmark725.cjs
      - name: Comparer le modèle avec la base
        if: hashFiles('tests/model725.cjs') != ''
        run: BASE_MODEL="$GITHUB_WORKSPACE/baseline724/sources_assets/car/2008.glb" node tests/model725.cjs
      - name: Conserver les mesures
        if: always() && hashFiles('tests/benchmark725.cjs') != ''
        uses: actions/upload-artifact@v4
        with:
          name: mesures-performances-7.25
          path: ${{ runner.temp }}/mesures-performances725.json
          if-no-files-found: warn
      - name: Compiler le pont Android modifié
        if: hashFiles('sources_assets/v725.js') != ''
        run: |
          platform="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -n 1)"
          test -n "$platform"
          mkdir -p "$RUNNER_TEMP/native725"
          javac -encoding UTF-8 -source 8 -target 8 -cp "$platform" -d "$RUNNER_TEMP/native725" module_GPS_java/java/fr/gtline/accueil2008/*.java
      - name: Construire l'appli compagnon (sans signature)
        if: hashFiles('compagnon/AndroidManifest.xml') != ''
        run: bash outils/construire_masque.sh "$RUNNER_TEMP/masque"
