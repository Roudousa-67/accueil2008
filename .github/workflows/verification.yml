name: Vérifier les sources
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix tests --ignore-scripts
      - run: npm test --prefix tests
        env:
          WIDGET_QA: ${{ runner.temp }}/widget-qa
      - name: Joindre les captures du rendu réel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-jour-nuit
          path: ${{ runner.temp }}/widget-qa
          if-no-files-found: warn
          retention-days: 14
      - name: Contrôler l’APK livré
        run: sha256sum --check distribution/SHA256SUMS
      - name: Valider la version préparée
        run: python3 outils/validate_release.py distribution/release.json
