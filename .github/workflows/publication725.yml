name: Publier l’APK 7.25 autorisé
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publication725.yml'
permissions:
  contents: read
concurrency:
  group: publication-version
  cancel-in-progress: false
jobs:
  publier725:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests --ignore-scripts
      - run: npm test --prefix tests
      - run: sha256sum --check distribution/SHA256SUMS
      - run: python3 outils/validate_release.py distribution/release.json
      - name: Vérifier le certificat de mise à jour
        run: |
          python3 - <<'PYVERIFY'
          import sys
          sys.path.insert(0,'outils')
          from preparer_apk_decors import sdk_tool,certificates
          tool=sdk_tool('apksigner',None)
          assert certificates(tool,'distribution/Accueil2008GT_v7.23.apk') == certificates(tool,'distribution/Accueil2008GT_v7.25.apk'), 'Signature différente'
          print('Certificat d’origine vérifié.')
          PYVERIFY
      - name: Publier l’APK signé demandé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(python3 -c 'import json; print(json.load(open("distribution/release.json"))["version"])')" = 7.25
          apk=Accueil2008GT_v7.25.apk
          if gh release view v7.25 >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/verify725"
            gh release download v7.25 --pattern "$apk" --dir "$RUNNER_TEMP/verify725"
            cmp "distribution/$apk" "$RUNNER_TEMP/verify725/$apk"
            gh release edit v7.25 --draft=false
          else
            gh release create v7.25 "distribution/$apk" distribution/SHA256SUMS --target "$GITHUB_SHA" --title 'Accueil 2008 GT 7.25' --notes-file distribution/NOTES.md
          fi
      - name: Annoncer la mise à jour après publication
        run: |
          cp distribution/release.json version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m 'Annoncer la version 7.25 disponible aux autoradios'
            git push origin HEAD:main
          fi

