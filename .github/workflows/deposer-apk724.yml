name: Déposer l’APK 7.24 signé
on:
  push:
    branches: [feat/widget-decors-illustres]
    paths:
      - 'distribution/patch724-signe.b64'
      - 'outils/reconstruire_apk724.py'
      - '.github/workflows/deposer-apk724.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: depot-apk724
  cancel-in-progress: false
jobs:
  depot:
    if: github.ref == 'refs/heads/feat/widget-decors-illustres'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reconstituer exactement l’APK déjà signé
        run: python3 outils/reconstruire_apk724.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests --ignore-scripts
      - run: npm test --prefix tests
      - run: sha256sum --check distribution/SHA256SUMS
      - run: python3 outils/validate_release.py distribution/release.json
      - name: Vérifier la signature de mise à jour
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          sys.path.insert(0, "outils")
          from preparer_apk_decors import sdk_tool
          tool = sdk_tool("apksigner", None)
          def cert(path):
              text = subprocess.check_output([tool, "verify", "--print-certs", path], text=True)
              hashes = set(re.findall(r"certificate SHA-256 digest: ([0-9a-fA-F]+)", text))
              if not hashes:
                  raise SystemExit("Certificat introuvable")
              return hashes
          assert cert("distribution/Accueil2008GT_v7.23.apk") == cert("distribution/Accueil2008GT_v7.24.apk"), "Signature incompatible"
          print("Même certificat de signature que la version 7.23.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Accueil2008GT-v7.24-signe
          path: |
            distribution/Accueil2008GT_v7.24.apk
            distribution/SHA256SUMS
          retention-days: 30
      - name: Enregistrer uniquement l’APK signé dans la branche
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- distribution/Accueil2008GT_v7.24.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Déposer l’APK 7.24 signé et vérifié'
            git push origin HEAD:feat/widget-decors-illustres
          fi

