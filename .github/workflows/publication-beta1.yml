name: Publier la bêta indépendante 7.27.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publication-beta1.yml']
permissions:
  contents: write
concurrency:
  group: publication-beta
  cancel-in-progress: false
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier le paquet bêta et la conservation de la stable
        run: |
          python3 beta/outils/reconstruire_beta.py
          python3 - <<'PY'
          import json,hashlib,zipfile,subprocess,re,pathlib,os
          root=pathlib.Path('.');base=root/'distribution/Accueil2008GT_v7.26.apk';apk=root/'beta/distribution/Accueil2008GT_v7.27.1.apk';meta=json.load(open('beta/distribution/release-beta.json'))
          assert hashlib.sha256(base.read_bytes()).hexdigest()=='b101e50c1e1c0f295ea1b8471f1ee8aa87a9b0a6b2b73abadc7f841f2330f109'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==meta['sha256']
          assert meta['channel']=='beta' and meta['package']=='fr.gtline.accueil2008.beta'
          stable_meta=(root/'version.json').read_bytes();pathlib.Path(os.environ['RUNNER_TEMP']+'/stable-meta-before').write_bytes(stable_meta)
          assert json.loads(stable_meta)['version']=='7.26'
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools';signer=sorted(tools.glob('*/apksigner'))[-1];aapt=sorted(tools.glob('*/aapt'))[-1]
          def cert(p):return set(re.findall(r'certificate SHA-256 digest: ([0-9a-fA-F]+)',subprocess.check_output([str(signer),'verify','--print-certs',str(p)],text=True)))
          assert cert(apk) and cert(apk)==cert(base)
          badging=subprocess.check_output([str(aapt),'dump','badging',str(apk)],text=True)
          assert "package: name='fr.gtline.accueil2008.beta' versionCode='1001' versionName='7.27.1'" in badging
          assert "name='fr.gtline.accueil2008.MainActivity'" in badging
          manifest=subprocess.check_output([str(aapt),'dump','xmltree',str(apk),'AndroidManifest.xml'],text=True)
          assert 'fr.gtline.accueil2008.beta.gpsdock' in manifest
          for blocked in ['android.intent.category.HOME','android.intent.action.BOOT_COMPLETED','android.intent.action.LOCKED_BOOT_COMPLETED','android.intent.action.QUICKBOOT_POWERON','com.qf.action.ACC_ON','android:sharedUserId']:assert blocked not in manifest
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'beta-assets';dest.mkdir()
          with zipfile.ZipFile(base) as stable,zipfile.ZipFile(apk) as beta:
              assert beta.testzip() is None
              for n in ['classes.dex','classes2.dex','classes3.dex']:assert beta.read(n)==stable.read(n)
              assert '/main/version-beta.json?t=' in beta.read('assets/v4.js').decode()
              for name in beta.namelist():
                  assert not name.endswith(('.p12','.jks','.keystore'))
                  if not name.startswith('assets/'):continue
                  rel=pathlib.PurePosixPath(name).relative_to('assets');assert '..' not in rel.parts
                  p=dest/str(rel);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(beta.read(name))
          print('Séparation, version, signature, intégrité et canal bêta vérifiés.')
          PY
      - run: npm ci --prefix tests --ignore-scripts
      - name: Tester les modes Démo, GPS, GPX et le retour à la stable
        run: BETA_ASSETS="$RUNNER_TEMP/beta-assets" BETA_FIXTURE="$GITHUB_WORKSPACE/tests/regression.cjs" NODE_PATH="$GITHUB_WORKSPACE/tests/node_modules" node beta/tests/beta727.cjs
      - name: Publier uniquement une préversion et vérifier son téléchargement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=Accueil2008GT_v7.27.1.apk
          if gh release view v7.27.1 >/dev/null 2>&1; then
            test "$(gh release view v7.27.1 --json isPrerelease -q .isPrerelease)" = true
          else
            gh release create v7.27.1 "beta/distribution/$apk" beta/distribution/release-beta.json beta/LISEZMOI.md --prerelease --target "$GITHUB_SHA" --title 'Accueil 2008 GT — Bêta 1 (7.27.1)' --notes-file beta/LISEZMOI.md
          fi
          mkdir -p "$RUNNER_TEMP/beta-download"
          gh release download v7.27.1 --pattern "$apk" --dir "$RUNNER_TEMP/beta-download"
          cmp "beta/distribution/$apk" "$RUNNER_TEMP/beta-download/$apk"
      - name: Annoncer la bêta sans changer le canal stable
        run: |
          cmp version.json "$RUNNER_TEMP/stable-meta-before"
          cp beta/distribution/release-beta.json version-beta.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version-beta.json
          git add -f beta/distribution/Accueil2008GT_v7.27.1.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publier le canal bêta séparé sans modifier version.json'
            git push origin HEAD:main
          fi
