name: Construire et publier APK 7.35
on:
  # Version publiée : relance manuelle uniquement, pour ne pas reconstruire une ancienne version à chaque envoi sur main.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publication-stable
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests --ignore-scripts
      - run: npm test --prefix tests
      - name: Exiger la clé d'origine dans les secrets GitHub
        env:
          ACCUEIL_KEYSTORE_BASE64: ${{ secrets.ACCUEIL_KEYSTORE_BASE64 }}
          ACCUEIL_SIGNING_PASSWORD: ${{ secrets.ACCUEIL_SIGNING_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          if not os.getenv('ACCUEIL_KEYSTORE_BASE64') or not os.getenv('ACCUEIL_SIGNING_PASSWORD'):
              raise SystemExit('Secrets de signature absents : publication annulée sans générer de nouvelle clé.')
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'accueil-original.p12'
          p.write_bytes(base64.b64decode(os.environ['ACCUEIL_KEYSTORE_BASE64'],validate=True))
          p.chmod(0o600)
          PY
      - name: Construire et signer 7.35
        env:
          ACCUEIL_SIGNING_PASSWORD: ${{ secrets.ACCUEIL_SIGNING_PASSWORD }}
          ACCUEIL_KEY_PASSWORD: ${{ secrets.ACCUEIL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -n "$signer"
          python3 outils/preparer_apk728.py --version 7.35 --keystore "$RUNNER_TEMP/accueil-original.p12" --apksigner "$signer" --output "$RUNNER_TEMP/Accueil2008GT_v7.35.apk"
      - name: Vérifier les métadonnées et publier le vrai APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/Accueil2008GT_v7.35.apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          "$aapt" dump badging "$apk" | grep -F "package: name='fr.gtline.accueil2008' versionCode='105' versionName='7.35'"
          sha256sum "$apk"
          if gh release view v7.35 >/dev/null 2>&1; then
            echo 'La release existe déjà : ne pas écraser un APK publié.'
            exit 1
          fi
          gh release create v7.35 "$apk" --target "$GITHUB_SHA" --title "Accueil 2008 GT 7.35" --notes "Version 7.35 : fluidité du widget, contexte GPS et décors météo. Essais sur autoradio à effectuer."
          mkdir -p "$RUNNER_TEMP/check"
          gh release download v7.35 --pattern Accueil2008GT_v7.35.apk --dir "$RUNNER_TEMP/check"
          cmp "$apk" "$RUNNER_TEMP/check/Accueil2008GT_v7.35.apk"
      - name: Annoncer uniquement le fichier réellement téléchargeable
        run: |
          python3 - <<'PY'
          import json,hashlib,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'Accueil2008GT_v7.35.apk'
          j=json.loads(pathlib.Path('distribution/release735.json').read_text())
          j['sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          for name in ('version.json','distribution/release735.json'):
              pathlib.Path(name).write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json distribution/release735.json
          git commit -m 'Annoncer APK 7.35 signé et téléchargé avec empreinte vérifiée'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Effacer la copie temporaire de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/accueil-original.p12"
