name: Déposer l’APK normal 7.28 signé
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deposer728.yml']
permissions:
  contents: write
concurrency:
  group: publication-stable
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstituer et contrôler le paquet signé
        run: |
          python3 outils/reconstruire_apk728.py
          python3 - <<'PY'
          import sys,pathlib,json,hashlib,subprocess,os,re
          sys.path.insert(0,str(pathlib.Path('outils').resolve()))
          from preparer_apk728 import validate
          base=pathlib.Path('distribution/Accueil2008GT_v7.26.apk');apk=pathlib.Path('distribution/Accueil2008GT_v7.28.apk')
          assert hashlib.sha256(base.read_bytes()).hexdigest()=='b101e50c1e1c0f295ea1b8471f1ee8aa87a9b0a6b2b73abadc7f841f2330f109'
          meta=json.load(open('distribution/release728.json'));assert hashlib.sha256(apk.read_bytes()).hexdigest()==meta['sha256']
          assert meta['version']=='7.28'
          validate(apk,pathlib.Path('sources_assets'),base)
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools';signer=sorted(tools.glob('*/apksigner'))[-1];aapt=sorted(tools.glob('*/aapt'))[-1]
          def cert(p):return set(re.findall(r'certificate SHA-256 digest: ([0-9a-fA-F]+)',subprocess.check_output([signer,'verify','--print-certs',p],text=True)))
          assert cert(apk) and cert(apk)==cert(base)==cert(pathlib.Path('distribution/Accueil2008GT_v7.23.apk'))
          badging=subprocess.check_output([aapt,'dump','badging',apk],text=True)
          assert "package: name='fr.gtline.accueil2008' versionCode='98' versionName='7.28'" in badging
          def version(v):return tuple(map(int,(v+'.0').split('.')[:3]))
          assert version(json.load(open('version.json'))['version'])<=version('7.28')
          print('Identité Android, assets, DEX et signature d’origine vérifiés.')
          PY
      - run: npm ci --prefix tests --ignore-scripts
      - name: Vérifier l’intégration 7.28
        run: node tests/widget728.cjs
      - name: Publier la version normale puis retélécharger l’APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v7.28 >/dev/null 2>&1; then
            test "$(gh release view v7.28 --json isPrerelease -q .isPrerelease)" = false
          else
            gh release create v7.28 distribution/Accueil2008GT_v7.28.apk distribution/release728.json --latest --target "$GITHUB_SHA" --title 'Accueil 2008 GT 7.28' --notes-file MISE_A_JOUR_728.md
          fi
          gh release download v7.28 --pattern Accueil2008GT_v7.28.apk --dir "$RUNNER_TEMP/verification728"
          cmp distribution/Accueil2008GT_v7.28.apk "$RUNNER_TEMP/verification728/Accueil2008GT_v7.28.apk"
      - name: Annoncer la version effectivement publiée
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          metadata=Path('distribution/release728.json').read_bytes()
          Path('version.json').write_bytes(metadata);Path('distribution/release.json').write_bytes(metadata)
          sha=json.loads(metadata)['sha256'];p=Path('distribution/SHA256SUMS');lines=[s for s in p.read_text().splitlines() if not s.endswith('distribution/Accueil2008GT_v7.28.apk')];lines.append(sha+'  distribution/Accueil2008GT_v7.28.apk');p.write_text('\n'.join(lines)+'\n')
          p=Path('README.md');s=p.read_text();end=s.index('\n\n',s.index('Les sources et le constructeur sont disponibles.'))
          start=s.index('Les sources et le constructeur sont disponibles.')
          s=s[:start]+'La version normale 7.28 est publiée avec la signature d’origine. Télécharger [Accueil2008GT_v7.28.apk](https://github.com/Roudousa-67/accueil2008/releases/download/v7.28/Accueil2008GT_v7.28.apk) et l’installer par-dessus la version stable existante. Les réglages sont conservés. La clé privée ne figure ni dans ce dépôt ni dans la release.'+s[end:]
          s=s.replace('## Version normale 7.28 préparée','## Version normale 7.28 publiée',1);p.write_text(s)
          PY
          python3 outils/validate_release.py distribution/release728.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json distribution/release.json distribution/release728.json distribution/SHA256SUMS README.md
          git add -f distribution/Accueil2008GT_v7.28.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publier l’APK normal 7.28, signé avec la clé d’origine'
            git push origin HEAD:main
          fi
